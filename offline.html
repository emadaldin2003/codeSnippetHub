<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0E14" />
    <title>غير متصل - Code Snippet Hub</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .offline-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background: var(--bg-primary);
        }
        .offline-container .offline-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.6;
        }
        .offline-container h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .offline-container p {
            color: var(--text-secondary);
            max-width: 400px;
            margin-bottom: 24px;
        }
        .offline-container .btn {
            padding: 10px 32px;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>أنت غير متصل بالإنترنت</h1>
        <p>لا تقلق! الأكواد التي حفظتها مسبقاً متاحة لك. لكن لإضافة أكواد جديدة أو تعديلها، ستحتاج إلى اتصال بالشبكة.</p>
        <button class="btn btn-primary" onclick="location.reload()">🔄 محاولة إعادة الاتصال</button>
        <br><br>
        <a href="index.html" style="color: var(--text-secondary);">🏠 العودة للرئيسية</a>
    </div>
</body>
</html>
